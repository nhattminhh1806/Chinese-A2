<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thẻ từ TOCFL</title>
<meta name="description" content="Luyện từ vựng TOCFL Level 1 và Level 2 bằng thẻ từ, trắc nghiệm, gõ chữ Hán và phát âm.">
<meta name="theme-color" content="#F2F4F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thẻ từ TOCFL">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='10' fill='%23fff' stroke='%232446C4' stroke-width='4'/%3E%3Cpath d='M32 6v52M6 32h52' stroke='%23AEBCEE' stroke-width='2' stroke-dasharray='4 4'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23131A2E'%3E字%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F9; --card:#FFFFFF; --ink:#131A2E; --muted:#5A6480; --line:#D9DEEC;
  --blue:#2446C4; --blue-deep:#1A3399; --blue-soft:#E7ECFB; --grid:#8FA2E6; --grid-dash:#B9C5F0;
  --ok:#1B8554; --ok-soft:#E2F3E9; --bad:#C2392F; --bad-soft:#FBE8E5;
  --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --han:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:20px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.han{font-family:var(--han)}

/* ---------- ô chữ điền (田字格) ---------- */
.zis{display:grid;grid-template-columns:repeat(var(--n),minmax(0,var(--max,104px)));gap:6px;justify-content:center;width:100%}
.zi{aspect-ratio:1;container-type:inline-size;display:grid;place-items:center;border:1.5px solid var(--grid);border-radius:6px;
  background:
    repeating-linear-gradient(90deg,var(--grid-dash) 0 4px,transparent 4px 8px) center/100% 1px no-repeat,
    repeating-linear-gradient(0deg,var(--grid-dash) 0 4px,transparent 4px 8px) center/1px 100% no-repeat,
    #fff}
.zi>span{font-family:var(--han);font-size:56px;font-size:72cqw;line-height:1;color:var(--ink)}
.zis-md{--max:78px}
.zis-sm{--max:44px;gap:4px}
.zis-sm .zi{border-width:1px;border-radius:4px}

/* ---------- trang chủ ---------- */
.home-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:28px 0 20px}
.brand .zis{justify-content:start;margin-bottom:12px}
.brand h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.iconbtn:active{background:var(--blue-soft)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:#E4E8F2;border-radius:var(--r-md)}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 8px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(19,26,46,.12)}
.seg small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.lvl button{flex-direction:column;gap:0;padding:8px}
.lvl .han{font-size:19px;line-height:1.3}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:14px;padding:14px 16px;border:0;border-radius:var(--r-md);background:var(--blue);color:#fff;text-align:left}
.resume b{display:block;font-weight:600}
.resume span{font-size:13.5px;opacity:.85}
.resume:active{background:var(--blue-deep)}
.lvl-sum{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px;font-size:14px;color:var(--muted)}
.lvl-sum b{color:var(--ink);font-weight:600}
.bar{height:6px;border-radius:3px;background:#E0E5F1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
.bar.ok i{background:var(--ok)}
.topics{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.topic{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px 16px}
.topic-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.topic-h h2{margin:0;font-size:16.5px;font-weight:600}
.topic-h .han{display:block;font-size:14.5px;color:var(--muted);font-weight:400}
.topic-h em{font-style:normal;font-size:13.5px;color:var(--muted);white-space:nowrap}
.topic .bar{margin:10px 0 12px}
.lessons{display:flex;flex-wrap:wrap;gap:8px}
.lesson{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px 8px 10px;font-weight:600;font-size:14.5px;min-height:40px}
.lesson small{font-weight:500;color:var(--muted);font-size:13px}
.lesson .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--grid);display:grid;place-items:center;flex:none;background:#fff}
.lesson.part .dot{background:conic-gradient(var(--blue) var(--p),#fff 0)}
.lesson.done{border-color:#B9DEC9;background:var(--ok-soft)}
.lesson.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.lesson.done .dot .ico{width:12px;height:12px;stroke-width:3}
.lesson:active{border-color:var(--blue)}
.foot{margin:26px 0 0;color:var(--muted);font-size:13px;text-align:center}

/* ---------- màn hình bài học ---------- */
.lhead{position:sticky;top:0;z-index:5;background:var(--paper);margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.back{display:flex;align-items:center;gap:4px;border:0;background:transparent;padding:10px 10px 10px 0;color:var(--muted);font-weight:500;min-height:44px}
.lmeta{text-align:right;min-width:0}
.lmeta small{display:block;color:var(--blue);font-weight:600;font-size:12.5px}
.lmeta b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{margin-top:14px}
.tabs .ico{width:18px;height:18px}
.tabs button[aria-selected="true"]{background:var(--blue);color:#fff;box-shadow:none}

.steprow{display:flex;align-items:flex-start;gap:8px;margin-top:16px}
.steps{flex:1;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.steps::before{content:"";position:absolute;left:12.5%;right:12.5%;top:15px;height:2px;background:var(--line)}
.steps button{position:relative;width:100%;border:0;background:transparent;padding:0 2px;display:grid;justify-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--muted);min-height:54px;white-space:nowrap;letter-spacing:-.01em}
.steps .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.steps .is-done .n{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.steps .is-done .n .ico{width:16px;height:16px;stroke-width:2.6}
.steps .is-cur .n{border-color:var(--blue);background:var(--blue);color:#fff}
.steps .is-cur{color:var(--ink);font-weight:600}
.steps .is-off{opacity:.4}
.where{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 6px;font-size:14px;color:var(--muted)}
.where b{color:var(--ink);font-weight:600}
.wnav{display:flex;align-items:center;gap:2px}
.wnav button{width:36px;height:36px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.wnav button:active{background:var(--blue-soft)}

.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 18px;box-shadow:0 2px 0 #E3E7F2}
.card.flip{animation:flip .28s ease-out}
@keyframes flip{from{transform:perspective(900px) rotateX(-70deg);opacity:.2}to{transform:none;opacity:1}}
.fc{position:relative;min-height:340px;padding-top:62px;padding-bottom:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;gap:10px;-webkit-tap-highlight-color:transparent}
.spk{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1px solid #C9D3F5;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.spk:active{background:#D6DEF8}
.pinyin{font-size:21px;font-weight:500;color:var(--blue);letter-spacing:.02em}
.alt{font-size:14px;color:var(--muted)}
.alt .han{font-size:17px;color:var(--ink)}
.hint{color:var(--muted);font-size:14.5px}
.mean{font-size:27px;font-weight:700;line-height:1.25;letter-spacing:-.01em;max-width:22ch;text-wrap:balance}
.mean::first-letter{text-transform:uppercase}
.mean.long{font-size:20px;font-weight:600;max-width:28ch}
.pos{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.pos code{font-family:var(--ui);font-weight:600;font-size:12.5px;color:var(--blue-deep);background:var(--blue-soft);padding:2px 7px;border-radius:5px}
.ex{width:100%;border-top:1px solid var(--line);padding-top:14px;margin-top:6px;display:grid;justify-items:center;gap:6px}
.ex .han{font-size:22px;line-height:1.45}
.ex mark{background:none;color:var(--blue);border-bottom:2px solid var(--grid-dash)}
.ex .exvi{font-size:15px;color:var(--muted);max-width:34ch}
.ex .pill{margin-top:4px}
.row{display:flex;gap:10px;width:100%;margin-top:14px}
.btn{flex:1;border:0;border-radius:12px;padding:13px 16px;font-weight:600;min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff}
.btn:active{background:var(--blue-deep)}
.btn.ok{background:var(--ok)}
.btn.soft{background:var(--ok-soft);color:var(--ok);border:1px solid #B9DEC9}
.btn.ghost{background:var(--card);color:var(--muted);border:1px solid var(--line);flex:0 0 auto}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}

.q{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.opts{display:grid;gap:10px;width:100%;margin-top:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;min-height:54px;font-size:15.5px}
.opt i{font-style:normal;font-weight:700;font-size:13px;width:26px;height:26px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none;color:var(--muted)}
.opt:active{border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right i{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.wrong i{background:var(--bad);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #C9D3F5;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;min-height:36px}
.pill .ico{width:16px;height:16px}
.field{width:100%;margin-top:6px;border:2px solid var(--line);border-radius:12px;background:#F8F9FC;padding:14px;text-align:center;font-family:var(--han);font-size:32px;line-height:1.3;color:var(--ink);min-height:76px}
.field::placeholder{font-family:var(--ui);font-size:20px;color:#9AA3BA}
.field:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px var(--blue-soft)}
.field.right{border-color:var(--ok);background:var(--ok-soft)}
.field.wrong{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:22px;font-size:14px;color:var(--muted)}
.msg.ok{color:var(--ok);font-weight:600}
.msg.bad{color:var(--bad)}
.voice{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0 2px}
.voice .spk{position:static;width:56px;height:56px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--blue-deep)}
.mic .ico{width:34px;height:34px}
.mic:active{transform:translateY(3px);box-shadow:0 3px 0 var(--blue-deep)}
.mic.live{background:var(--bad);box-shadow:0 6px 0 #8F2A22;animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 #8F2A22,0 0 0 12px rgba(194,57,47,.14)}}
.under{margin:14px 4px 0;text-align:center;color:var(--muted);font-size:13.5px}

.fin{text-align:center;display:grid;gap:10px;justify-items:center}
.fin h2{margin:6px 0 0;font-size:22px}
.fin p{margin:0;color:var(--muted)}
.fin .row{flex-direction:column}

/* ---------- xem từ ---------- */
.list{list-style:none;margin:14px 0 0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.wrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px}
.wrow:active{background:var(--blue-soft)}
.wrow .w{font-family:var(--han);font-size:26px;line-height:1.2;min-width:2.2em}
.wrow .p{display:block;color:var(--blue);font-size:14px;font-weight:500}
.wrow .m{display:block;font-size:15px}
.wrow .t{display:block;font-size:12.5px;color:var(--muted)}
.wrow .st{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--grid)}
.wrow .st.half{background:var(--grid-dash)}
.wrow .st.full{background:var(--ok);border-color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 4px 0;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--grid);display:inline-block}

/* ---------- chơi ghép thẻ ---------- */
.ghead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 0;font-size:14px;color:var(--muted)}
.ghead b{color:var(--ink);font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px;margin-top:10px}
.col{display:grid;gap:10px;align-content:start}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:12px;min-height:64px;padding:8px 10px;display:grid;place-items:center;text-align:center;font-size:14.5px;line-height:1.3;box-shadow:0 2px 0 #E3E7F2}
.tile.h{font-family:var(--han);font-size:26px}
.tile.sel{border-color:var(--blue);background:var(--blue-soft)}
.tile.gone{visibility:hidden}
.tile.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}

/* ---------- cài đặt ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(19,26,46,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0;font-size:19px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.set{padding:14px 0;border-top:1px solid var(--line)}
.set>b{display:block;font-weight:600;margin-bottom:4px}
.set p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;min-height:44px}
.sw span small{display:block;color:var(--muted);font-size:13px}
.sw input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:#CCD2E2;position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--blue)}
.sw input:checked::after{transform:translateX(20px)}
.sw input:disabled{opacity:.5}
.danger{border:1px solid #EBC3BE;background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 14px;font-weight:600;width:100%;min-height:46px}

@media (max-width:360px){
  .steps button{font-size:11px}
  .mean{font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="sheet"></div>
<noscript><p style="padding:24px">Trang này cần bật JavaScript để chạy.</p></noscript>

<script>
/* =====================================================================
   DỮ LIỆU TỪ VỰNG
   Mỗi từ là một mảng: [chữ Hán, pinyin, từ loại, nghĩa tiếng Việt, câu ví dụ (tuỳ chọn), nghĩa câu ví dụ (tuỳ chọn)]
   Muốn sửa nghĩa hay thêm câu ví dụ thì sửa trực tiếp trong khối này.
   ===================================================================== */
const LEVELS = [
{"id":1,"zh":"入門級","name":"Level 1","topics":[
  {"zh":"個人資料","vi":"Thông tin cá nhân","words":[

    ["奶奶","nǎinai","N","bà nội","奶奶做的菜很好吃。","Món bà nội nấu rất ngon."],
    ["家庭","jiātíng","N","gia đình","他有一個快樂的家庭。","Anh ấy có một gia đình vui vẻ."],
    ["別人","biérén","N","người khác","不要拿別人的東西。","Đừng lấy đồ của người khác."],
    ["大人","dàrén","N","người lớn","大人和小孩都喜歡這部電影。","Người lớn và trẻ con đều thích bộ phim này."],
    ["老人","lǎorén","N","người già","那位老人每天早上去公園。","Cụ già ấy sáng nào cũng ra công viên."],
    ["年輕","niánqīng","Vs","trẻ, trẻ tuổi","我的老師很年輕。","Thầy giáo của tôi rất trẻ."],
    ["男生","nánshēng","N","con trai, nam sinh","我們班有十個男生。","Lớp chúng tôi có mười bạn nam."],

<script>
(() => {
'use strict';

/* ---------- tiện ích ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const bitsCount = b => (b & 1) + (b >> 1 & 1) + (b >> 2 & 1) + (b >> 3 & 1);
const ICON = {
  spk: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="2"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  next: '<path d="M9 5l7 7-7 7"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  set: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  cap: '<path d="M3 9l9-4 9 4-9 4-9-4z"/><path d="M7 11v5c3 2 7 2 10 0v-5"/>',
  play: '<rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 11v3M6.5 12.5h3M15.5 11.5h.01M17.5 13.5h.01"/>',
  again: '<path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4h4"/>'
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

const POS = {
  'N': 'danh từ', 'V': 'động từ', 'Vi': 'nội động từ', 'Vs': 'tính từ (động từ trạng thái)',
  'Vst': 'động từ trạng thái có tân ngữ', 'Vp': 'động từ chỉ sự thay đổi', 'Vpt': 'động từ chỉ sự thay đổi có tân ngữ',
  'Vaux': 'trợ động từ', 'V-sep': 'động từ ly hợp', 'Vs-sep': 'tính từ ly hợp', 'Vp-sep': 'động từ ly hợp chỉ sự thay đổi',
  'Vs-pred': 'tính từ chỉ làm vị ngữ', 'Vs-attr': 'tính từ chỉ làm định ngữ',
  'Adv': 'phó từ', 'M': 'lượng từ', 'Conj': 'liên từ', 'Prep': 'giới từ', 'Ptc': 'trợ từ', 'Det': 'từ hạn định'
};
const STEPS = ['Flashcard', 'Trắc nghiệm', 'Gõ từ', 'Phát âm'];

/* ---------- chuẩn bị dữ liệu ---------- */
const expand = alt => { const m = alt.match(/^(.*?)\((.*?)\)(.*)$/); return m ? [m[1] + m[2] + m[3], m[1] + m[3]] : [alt]; };
const segsOf = m => m.toLowerCase().replace(/\(.*?\)/g, '').split(/[,;]/).map(s => s.trim()).filter(Boolean);
LEVELS.forEach((L, li) => {
  L.all = [];
  L.topics.forEach((T, ti) => {
    T.items = T.words.map(a => {
      const forms = [...new Set(a[0].split('/').flatMap(expand))].filter(Boolean);
      const w = { id: L.id + '|' + a[0] + '|' + a[1], li, ti, w: a[0], p: a[1].replace(/\//g, ' / '), pos: a[2], m: a[3], ex: a[4] || '', exVi: a[5] || '', forms, main: forms[0], segs: segsOf(a[3]) };
      L.all.push(w);
      return w;
    });
  });
});

/* ---------- lưu tiến độ ---------- */
const KEY = 'tocfl-the-tu-v1';
const DEF = { size: 20, shuffle: false, hidePinyin: false, autoSpeak: true, steps: [true, true, true, true] };
let S = (() => {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  return { prog: d.prog || {}, best: d.best || {}, lv: d.lv === 1 ? 1 : 0, last: d.last || null, set: Object.assign({}, DEF, d.set || {}) };
})();
if (!Array.isArray(S.set.steps) || S.set.steps.length !== 4) S.set.steps = DEF.steps.slice();
S.set.steps[0] = true;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const bitsOf = w => S.prog[w.id] || 0;
const isDone = w => bitsOf(w) === 15;

function lessonsOf(T) {
  const len = T.items.length, size = S.set.size;
  const n = size ? Math.ceil(len / size) : 1;
  const base = Math.floor(len / n), extra = len % n, out = [];
  let at = 0;
  for (let i = 0; i < n; i++) { const k = base + (i < extra ? 1 : 0); out.push(T.items.slice(at, at + k)); at += k; }
  return out;
}
const pctOf = ws => ws.length ? ws.reduce((s, w) => s + bitsCount(bitsOf(w)), 0) / (ws.length * 4) : 0;

/* ---------- đọc mẫu (Text-to-Speech) ---------- */
const TTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let voices = [];
if (TTS) {
  const lv = () => { voices = speechSynthesis.getVoices() || []; };
  lv();
  if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', lv);
}
function pickVoice() {
  const n = v => (v.lang || '').replace('_', '-').toLowerCase();
  return voices.find(v => n(v) === 'zh-tw') || voices.find(v => n(v).startsWith('zh-tw')) ||
         voices.find(v => n(v) === 'zh-cn') || voices.find(v => n(v).startsWith('zh') && !/hk|yue/.test(n(v))) || null;
}
function speak(text) {
  if (!TTS) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text), v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'zh-TW';
    u.rate = 0.8;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- nhận giọng nói / ghi âm ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srOff = false;
const canRec = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);

/* ---------- điều hướng ---------- */
let route = { name: 'home' };
let tab = 'hoc';
let sess = null;
let gameTimer = null;

function parseHash() {
  const m = location.hash.match(/^#\/(\d+)\/(\d+)\/(\d+)$/);
  if (m) {
    const li = +m[1], ti = +m[2], pi = +m[3];
    const T = LEVELS[li] && LEVELS[li].topics[ti];
    if (T && lessonsOf(T)[pi]) return { name: 'lesson', li, ti, pi };
  }
  return { name: 'home' };
}
function go(hash) { if (location.hash === hash) onRoute(); else location.hash = hash; }
function onRoute() {
  route = parseHash();
  stopAll();
  if (route.name === 'lesson') {
    const key = route.li + '/' + route.ti + '/' + route.pi;
    if (!sess || sess.key !== key) { startSession(route, key); tab = 'hoc'; }
    S.lv = route.li; S.last = { li: route.li, ti: route.ti, pi: route.pi, size: S.set.size }; save();
  } else sess = null;
  render();
  window.scrollTo(0, 0);
}
function stopAll() {
  if (gameTimer) { clearInterval(gameTimer); gameTimer = null; }
  if (TTS) try { speechSynthesis.cancel(); } catch (e) {}
  if (sess && sess.sp) stopMic();
}

/* ---------- phiên học ---------- */
function startSession(r, key) {
  const T = LEVELS[r.li].topics[r.ti];
  const words = lessonsOf(T)[r.pi];
  sess = { key, li: r.li, ti: r.ti, pi: r.pi, T, base: words, words: S.set.shuffle ? shuffle(words) : words.slice(), idx: 0, step: 0, game: null };
  const i = sess.words.findIndex(w => !isDone(w));
  if (i < 0) sess.idx = -1; else enterWord(i);
}
const cur = () => sess.words[sess.idx];
const enabled = i => !!S.set.steps[i];
function firstStep(w) {
  const b = bitsOf(w);
  for (let i = 0; i < 4; i++) if (enabled(i) && !(b >> i & 1)) return i;
  return 0;
}
function enterWord(i) { sess.idx = i; enterStep(firstStep(sess.words[i])); }
function enterStep(st) {
  if (sess.sp) stopMic();
  sess.step = st;
  sess.flipped = false; sess.anim = false;
  sess.quiz = null; sess.ty = { state: 'idle', tries: 0 }; sess.sp = { busy: false, res: null, err: '', url: '' };
  sess.spoken = false;
}
function advance() {
  const w = cur();
  let b = bitsOf(w) | (1 << sess.step);
  S.prog[w.id] = b;
  let nxt = -1;
  for (let i = sess.step + 1; i < 4; i++) if (enabled(i) && !(b >> i & 1)) { nxt = i; break; }
  if (nxt < 0) for (let i = 0; i < sess.step; i++) if (enabled(i) && !(b >> i & 1)) { nxt = i; break; }
  if (nxt >= 0) { save(); enterStep(nxt); }
  else { S.prog[w.id] = 15; save(); nextWord(); }
  render(true);
}
function nextWord() {
  const n = sess.words.length;
  for (let k = 1; k <= n; k++) { const i = (sess.idx + k) % n; if (!isDone(sess.words[i])) { enterWord(i); return; } }
  sess.idx = -1;
}

/* ---------- vẽ giao diện ---------- */
const app = $('#app');
const cells = (text, size) => `<div class="zis zis-${size}" style="--n:${[...text].length}" lang="zh-Hant">${[...text].map(c => `<span class="zi"><span>${esc(c)}</span></span>`).join('')}</div>`;
const posHtml = w => {
  const tags = w.pos ? w.pos.split(' / ') : [];
  if (!tags.length) return `<span class="pos">cụm từ cố định</span>`;
  return `<span class="pos">${tags.map(t => `<code>${esc(t)}</code>`).join('')} ${esc(tags.map(t => POS[t] || t).join(', '))}</span>`;
};
const altHtml = w => w.forms.length > 1 ? `<div class="alt">Cũng viết <span class="han" lang="zh-Hant">${w.forms.slice(1).map(esc).join('、')}</span></div>` : '';

function render(keepScroll) {
  if (route.name === 'home') app.innerHTML = homeHtml();
  else app.innerHTML = lessonHtml();
  if (route.name === 'lesson' && tab === 'hoc' && sess.idx >= 0) afterLearnRender();
}

function homeHtml() {
  const L = LEVELS[S.lv];
  const done = L.all.filter(isDone).length;
  let resume = '';
  if (S.last && S.last.size === S.set.size) {
    const T = LEVELS[S.last.li] && LEVELS[S.last.li].topics[S.last.ti];
    const ls = T && lessonsOf(T);
    if (ls && ls[S.last.pi]) {
      resume = `<button class="resume" data-act="open" data-l="${S.last.li}/${S.last.ti}/${S.last.pi}">

function exHtml(w) {

function makeQuiz(w) {
  const pool = LEVELS[w.li].all.filter(x => x !== w && x.main !== w.main && !x.segs.some(s => w.segs.includes(s)));
  const tag = (w.pos.split(' / ')[0] || '').replace(/-.*/, '').slice(0, 2);
  const same = pool.filter(x => (x.pos.split(' / ')[0] || '').replace(/-.*/, '').slice(0, 2) === tag);
  const picked = [];
  for (const x of shuffle(same).concat(shuffle(pool))) {
    if (picked.length === 3) break;
    if (picked.includes(x) || picked.some(y => y.segs.some(s => x.segs.includes(s)))) continue;
    picked.push(x);
  }
  return { opts: shuffle([w, ...picked]), wrong: new Set(), right: false };
}
function quizHtml(w) {
  if (!sess.quiz) sess.quiz = makeQuiz(w);
  const q = sess.quiz;
  return `<div class="card q">
    <div class="hint">Chọn nghĩa đúng của từ dưới đây</div>
    ${cells(w.main, 'md')}
    <div class="pinyin">${esc(w.p)}</div>
    <div class="opts">
      ${q.opts.map((o, i) => {
        const cls = q.right && o === w ? 'right' : q.wrong.has(i) ? 'wrong' : '';
        return `<button class="opt ${cls}" data-act="pick" data-i="${i}" ${q.right || q.wrong.has(i) ? 'disabled' : ''}><i>${'ABCD'[i]}</i><span>${esc(o.m)}</span></button>`;
      }).join('')}
    </div>
    <div class="msg ${q.right ? 'ok' : q.wrong.size ? 'bad' : ''}" aria-live="polite">${q.right ? '' : q.wrong.size ? 'Chưa đúng, chọn lại nhé.' : ''}</div>
    ${q.right ? `<button class="btn ok" data-act="adv" id="go" style="width:100%">Chính xác, tiếp tục</button>` : ''}
  </div>`;
}

function typeHtml(w) {

    <input class="field" id="ans" type="text" lang="zh-Hant" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Nhập Hán tự…" aria-label="Nhập chữ Hán">
    <div class="msg" id="tmsg" aria-live="polite"></div>

function checkTyped() {
  const w = cur(), inp = $('#ans'), msg = $('#tmsg'), t = sess.ty;
  if (t.state === 'right' || t.state === 'skipped') { advance(); return; }
  const v = inp.value.normalize('NFC').replace(/[\s　]/g, '');
  if (!v) { inp.focus(); return; }
  if (w.forms.includes(v) || v === w.w) {
    t.state = 'right';
    inp.classList.remove('wrong'); inp.classList.add('right'); inp.readOnly = true;
    msg.className = 'msg ok'; msg.textContent = 'Chính xác!';
    $('#chk').textContent = 'Tiếp tục'; $('#chk').classList.add('ok'); $('#skp').hidden = true;
    $('#chk').focus();
  } else {
    t.tries++;
    inp.classList.remove('wrong'); void inp.offsetWidth; inp.classList.add('wrong');
    msg.className = 'msg bad';
    const n = [...w.main].length;
    msg.textContent = t.tries >= 2 ? `Chưa đúng. Gợi ý: từ có ${n} chữ${n > 1 ? ', bắt đầu bằng ' + [...w.main][0] : ''}.` : 'Chưa đúng, thử lại hoặc bấm Bỏ qua để xem đáp án.';
    inp.focus(); inp.select();
  }
}
function skipTyped() {
  const w = cur(), inp = $('#ans'), msg = $('#tmsg');
  sess.ty.state = 'skipped';
  inp.value = w.main; inp.readOnly = true; inp.classList.remove('wrong');
  msg.className = 'msg'; msg.textContent = 'Đáp án ở trên. Nhìn kỹ từng nét rồi đi tiếp.';

function speakHtml(w) {
  const sp = sess.sp;
  let status = 'Bấm micro rồi đọc to từ này.';
  let cls = '';
  if (sp.busy) status = sp.mode === 'rec' ? 'Đang ghi âm trong 4 giây, hãy đọc to…' : 'Đang nghe, hãy đọc to…';
  else if (sp.res) {
    if (sp.res.ok) { status = `Máy nghe được 「${esc(sp.res.heard)}」, khớp với từ mẫu.`; cls = 'ok'; }
    else { status = `Máy nghe được 「${esc(sp.res.heard)}」, chưa khớp. Nghe mẫu rồi đọc chậm và rõ hơn.`; cls = 'bad'; }
  } else if (sp.url) status = 'Đã ghi âm xong. Nghe lại rồi so với giọng mẫu.';
  else if (sp.err === 'denied') { status = 'Trình duyệt chưa được cấp quyền micro. Hãy cho phép micro rồi bấm lại.'; cls = 'bad'; }
  else if (sp.err === 'silent') { status = 'Chưa nghe thấy gì. Bấm micro và đọc to hơn.'; cls = 'bad'; }
  else if (sp.err === 'fallback') status = 'Trình duyệt này không chấm được giọng nói. Bấm micro lần nữa để ghi âm rồi tự nghe lại.';
  else if (sp.err === 'none') status = 'Trình duyệt này không dùng được micro. Hãy nghe mẫu và đọc to theo.';
  else if (sp.err) { status = 'Micro gặp trục trặc, thử bấm lại.'; cls = 'bad'; }
  return `<div class="card q">
    <div class="hint">Nghe mẫu, sau đó bấm micro và nói to</div>
    ${cells(w.main, 'md')}
    <div class="pinyin">${esc(w.p)}</div>

    </div>
    <div class="msg ${cls}" aria-live="polite">${status}</div>
    ${sp.url && !sp.busy ? `<button class="pill" data-act="replay">${ico('again')} Nghe lại bản ghi của tôi</button>` : ''}
    <div style="font-size:18px;font-weight:500">${esc(w.m)}</div>
    <button class="btn" data-act="adv" style="width:100%;flex:none;margin-top:6px">Hoàn tất từ này ${ico('next')}</button>
  </div>`;
}
function stopMic() {
  const sp = sess.sp;
  if (!sp) return;
  try { if (sp.rec) sp.rec.abort ? sp.rec.abort() : sp.rec.stop(); } catch (e) {}
  try { if (sp.mr && sp.mr.state !== 'inactive') sp.mr.stop(); } catch (e) {}
  if (sp.timer) clearTimeout(sp.timer);
}
function micPress() {
  const w = cur(), sp = sess.sp, mine = sess.sp;
  if (sp.busy) { try { if (sp.rec) sp.rec.stop(); if (sp.mr && sp.mr.state !== 'inactive') sp.mr.stop(); } catch (e) {} return; }
  if (TTS) try { speechSynthesis.cancel(); } catch (e) {}
  sp.res = null; sp.err = '';
  const redraw = () => { if (sess && sess.sp === mine && tab === 'hoc') render(true); };
  if (SR && !srOff) {
    let got = false;
    const r = new SR();
    r.lang = 'zh-TW'; r.interimResults = false; r.maxAlternatives = 5;
    r.onresult = e => {
      got = true;
      const alts = Array.from(e.results[0]).map(a => a.transcript.replace(/[\s，。！？、,.!?]/g, ''));
      const ok = alts.some(a => w.forms.some(f => a === f || a.includes(f)));
      sp.res = { heard: (ok ? alts.find(a => w.forms.some(f => a.includes(f))) : alts[0]) || '', ok };
    };
    r.onerror = e => {
      if (e.error === 'not-allowed') sp.err = 'denied';
      else if (e.error === 'no-speech' || e.error === 'aborted') sp.err = 'silent';
      else { srOff = true; sp.err = 'x'; }
    };
    r.onend = () => { sp.busy = false; sp.rec = null; if (sp.timer) clearTimeout(sp.timer); if (!got && !sp.err) sp.err = 'silent'; if (srOff) sp.err = canRec ? 'fallback' : 'none'; redraw(); };
    try { r.start(); sp.rec = r; sp.busy = true; sp.mode = 'sr'; sp.timer = setTimeout(() => { try { r.stop(); } catch (e) {} }, 7000); }
    catch (e) { srOff = true; }
    if (sp.busy) { redraw(); return; }
  }
  if (canRec) {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      const chunks = [], mr = new MediaRecorder(stream);
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        if (sp.timer) clearTimeout(sp.timer);
        sp.busy = false; sp.mr = null;
        if (chunks.length) { if (sp.url) URL.revokeObjectURL(sp.url); sp.url = URL.createObjectURL(new Blob(chunks, { type: mr.mimeType || 'audio/webm' })); playRec(); }
        else sp.err = 'silent';
        redraw();
      };
      mr.start(); sp.mr = mr; sp.busy = true; sp.mode = 'rec';
      sp.timer = setTimeout(() => { try { if (mr.state !== 'inactive') mr.stop(); } catch (e) {} }, 4000);
      redraw();
    }).catch(() => { sp.err = 'denied'; redraw(); });
    return;
  }
  sp.err = 'none'; redraw();
}
function playRec() { const sp = sess.sp; if (sp && sp.url) { try { new Audio(sp.url).play().catch(() => {}); } catch (e) {} } }

function finishHtml(pct) {

/* ----- tab Chơi: ghép chữ Hán với nghĩa ----- */
const PER = 5;
function newGame() {
  sess.game = { queue: shuffle(sess.base), left: [], right: [], sel: null, miss: 0, t0: Date.now(), end: 0, gone: new Set(), bad: null, total: sess.base.length, cleared: 0 };
  nextBatch();
}
function nextBatch() {
  const g = sess.game, batch = [], rest = [];
  for (const w of g.queue) {
    if (batch.length < PER && !batch.some(x => x.main === w.main || x.segs.some(s => w.segs.includes(s)))) batch.push(w); else rest.push(w);
  }
  g.queue = rest; g.left = shuffle(batch); g.right = shuffle(batch); g.gone = new Set(); g.sel = null;
}
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function gameHtml() {
  if (!sess.game) newGame();
  const g = sess.game;
  if (g.end) {
    const secs = Math.round((g.end - g.t0) / 1000), best = S.best[sess.key + '@' + S.set.size];
    return `<div class="card fin">
      ${cells('過關', 'md')}
      <h2>Ghép xong ${g.total} từ</h2>
      <p>Thời gian ${fmt(secs)}, ghép sai ${g.miss} lần.${best ? ' Kỷ lục của bài: ' + fmt(best) + '.' : ''}</p>
      <div class="row"><button class="btn" data-act="regame">${ico('again')} Chơi lại</button><button class="btn line" data-act="tab" data-t="hoc">Quay lại học</button></div>
    </div>`;
  }
  if (!gameTimer) gameTimer = setInterval(() => { const el = $('#gt'); if (el && sess && sess.game && !sess.game.end) el.textContent = fmt((Date.now() - sess.game.t0) / 1000); }, 500);
  const tile = (w, side) => {
    const id = side + ':' + w.id;
    const cls = [side === 'L' ? 'h' : '', g.gone.has(w.id) ? 'gone' : '', g.sel === id ? 'sel' : '', g.bad && g.bad.includes(id) ? 'no' : ''].join(' ');
    return `<button class="tile ${cls}" data-act="tile" data-id="${esc(id)}" ${side === 'L' ? 'lang="zh-Hant"' : ''}>${esc(side === 'L' ? w.main : w.m)}</button>`;
  };
  return `<div class="ghead"><span>Ghép chữ Hán với nghĩa. Đã ghép <b>${g.cleared}/${g.total}</b></span><span>Sai <b>${g.miss}</b> · <b id="gt">${fmt((Date.now() - g.t0) / 1000)}</b></span></div>
  <div class="board"><div class="col">${g.left.map(w => tile(w, 'L')).join('')}</div><div class="col">${g.right.map(w => tile(w, 'R')).join('')}</div></div>`;
}
function tilePress(id) {
  const g = sess.game;
  g.bad = null;
  if (!g.sel || g.sel[0] === id[0]) { g.sel = g.sel === id ? null : id; render(true); return; }
  const a = g.sel.slice(2), b = id.slice(2);
  if (a === b) {
    g.gone.add(a); g.cleared++; g.sel = null;
    const w = sess.base.find(x => x.id === a); if (w) speak(w.main);
    if (g.gone.size === g.left.length) {
      if (g.queue.length) nextBatch();
      else {
        g.end = Date.now();
        const secs = Math.round((g.end - g.t0) / 1000), k = sess.key + '@' + S.set.size;
        if (!S.best[k] || secs < S.best[k]) { S.best[k] = secs; save(); }
        if (gameTimer) { clearInterval(gameTimer); gameTimer = null; }
      }
    }
  } else { g.miss++; g.bad = [g.sel, id]; g.sel = null; }
  render(true);
}

/* ----- cài đặt ----- */
const sheet = $('#sheet');
let wipeArmed = false;
function openSettings() { wipeArmed = false; drawSettings(); }
function closeSettings() { sheet.innerHTML = ''; }
function drawSettings() {
  const st = S.set;
  const sw = (key, label, sub, checked, dis) => `<label class="sw"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><input type="checkbox" data-set="${key}" ${checked ? 'checked' : ''} ${dis ? 'disabled' : ''}></label>`;
  sheet.innerHTML = `<div class="sheet" data-act="closeset"><div class="sheet-in" role="dialog" aria-modal="true" aria-label="Cài đặt">
    <div class="sheet-h"><h2>Cài đặt</h2><button class="iconbtn" data-act="closeset" data-x="1" aria-label="Đóng">${ico('x')}</button></div>
    <div class="set"><b>Số từ mỗi bài</b><p>Chủ đề dài được chia đều thành nhiều bài. Tiến độ từng từ vẫn giữ nguyên khi đổi.</p>
      <div class="seg">${[[10, '10'], [15, '15'], [20, '20'], [0, 'Cả chủ đề']].map(o => `<button aria-pressed="${st.size === o[0]}" data-act="size" data-v="${o[0]}">${o[1]}</button>`).join('')}</div></div>
    <div class="set"><b>Các bước học cho mỗi từ</b>
      ${STEPS.map((s, i) => sw('step' + i, (i + 1) + '. ' + s, i === 0 ? 'Luôn bật' : i === 3 ? 'Cần micro, chạy tốt nhất trên Chrome và Safari' : '', st.steps[i], i === 0)).join('')}</div>
    <div class="set"><b>Thẻ từ</b>
      ${sw('hidePinyin', 'Ẩn pinyin ở mặt trước', 'Tự nhớ cách đọc trước khi lật thẻ', st.hidePinyin)}
      ${sw('autoSpeak', 'Tự đọc từ khi mở thẻ', '', st.autoSpeak)}
      ${sw('shuffle', 'Trộn thứ tự từ trong bài', 'Áp dụng từ lần vào bài kế tiếp', st.shuffle)}</div>
    <div class="set"><b>Tiến độ</b><p>Xoá toàn bộ tiến độ học và kỷ lục trò chơi trên thiết bị này.</p>
      <button class="danger" data-act="wipe">${wipeArmed ? 'Bấm lần nữa để xoá hẳn' : 'Xoá tiến độ'}</button></div>
  </div></div>`;
}
sheet.addEventListener('change', e => {
  const k = e.target.dataset.set; if (!k) return;
  if (k.startsWith('step')) S.set.steps[+k.slice(4)] = e.target.checked; else S.set[k] = e.target.checked;
  S.set.steps[0] = true; save();
  if (sess && sess.idx >= 0 && !enabled(sess.step)) enterStep(firstStep(cur()));
  render(true);
});
sheet.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'closeset') { if (e.target === b || b.dataset.x) closeSettings(); }
  else if (act === 'size') {
    S.set.size = +b.dataset.v; save();
    if (route.name === 'lesson') { closeSettings(); sess = null; go(''); if (location.hash) location.hash = ''; }
    else { drawSettings(); render(true); }
  }
  else if (act === 'wipe') {
    if (!wipeArmed) { wipeArmed = true; drawSettings(); return; }
    S.prog = {}; S.best = {}; S.last = null; save(); wipeArmed = false; closeSettings();
    if (route.name === 'lesson') { sess = null; onRoute(); } else render();
  }
});

/* ---------- xử lý thao tác ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  switch (act) {
    case 'settings': openSettings(); break;
    case 'level': S.lv = +b.dataset.i; save(); render(); break;
    case 'open': go('#/' + b.dataset.l); break;
    case 'home': go(''); if (location.hash) location.hash = ''; break;
    case 'tab':
      stopAll(); tab = b.dataset.t;
      if (tab === 'hoc' && sess.idx >= 0) enterStep(sess.step);
      render(); break;
    case 'step': enterStep(+b.dataset.i); render(true); break;
    case 'prev': case 'nextw': {
      const n = sess.words.length; enterWord((sess.idx + (act === 'prev' ? n - 1 : 1)) % n); render(true); break;
    }
    case 'say': e.stopPropagation(); speak(cur().main); break;
    case 'sayex': e.stopPropagation(); speak(cur().ex); break;
    case 'flip': sess.flipped = !sess.flipped; sess.anim = true; render(true); break;
    case 'known': S.prog[cur().id] = 15; save(); nextWord(); render(true); break;
    case 'adv': advance(); break;
    case 'pick': {
      const q = sess.quiz, i = +b.dataset.i;
      if (q.opts[i] === cur()) q.right = true; else q.wrong.add(i);
      render(true);
      const goBtn = $('#go'); if (goBtn) goBtn.focus({ preventScroll: false });
      break;
    }
    case 'check': checkTyped(); break;
    case 'skip': skipTyped(); break;
    case 'mic': micPress(); break;
    case 'replay': playRec(); break;
    case 'redo': sess.words.forEach(w => { delete S.prog[w.id]; }); save(); sess = null; onRoute(); break;
    case 'sayrow': speak(sess.base[+b.dataset.i].main); break;
    case 'tile': tilePress(b.dataset.id); break;
    case 'regame': newGame(); render(true); break;
  }
});
app.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.fc[data-act="flip"]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.innerHTML) closeSettings(); });
window.addEventListener('hashchange', onRoute);
onRoute();
})();
</script>
</body>
</html>
